services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutritrace_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - nutritrace_net

  web:
    image: nginx:alpine
    container_name: nutritrace_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - nutritrace_net

  db:
    image: mysql:8.0
    container_name: nutritrace_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nutritrace
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - nutritrace_net

networks:
  nutritrace_net:
    driver: bridge

volumes:
  dbdata:
    driver: local