name: NutriTrace CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nutritrace_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 1. Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, zip, gd
          coverage: none

      - name: 3. Installer les dépendances Composer
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: 4. Vérifier le style du code (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: 5. Préparer l'environnement de test
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: 6. Exécuter les migrations et tests PHPUnit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nutritrace_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --env=testing --force
          php artisan test

      - name: 7. Compiler les assets (Vite / NPM)
        run: |
          npm ci
          npm run build

      - name: 8. Analyse Qualité SonarQube
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}